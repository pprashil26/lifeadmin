<div class="app"><header class="topbar"><div class="brand"><div class="brand-row"><img id="brandIcon" class="brand-mark" alt=""><h1>LIFE ADMIN</h1></div><p id="pageSubtitle">Due · Your next important life-admin dates</p></div><button class="toolbar-plus" id="calendarBtn" type="button" aria-label="Create item for a date">＋</button><button class="icon-btn" id="settingsBtn">⚙</button></header><main class="content"><section id="timelineView" class="view active"><div id="summary" class="summary"></div><div id="timelineContent"></div></section><section id="tasksView" class="view"><div id="taskSummary" class="summary task-summary"></div><div class="task-toolbar"><input id="taskSearch" class="task-search" type="search" placeholder="Search tasks"><button id="addTaskBtn" class="primary-btn task-add" type="button">＋ Task</button></div><div class="task-filters"><button class="task-filter active" data-task-filter="All">All</button><button class="task-filter" data-task-filter="Next">Next</button><button class="task-filter" data-task-filter="Active">Active</button><button class="task-filter" data-task-filter="Done">Done</button></div><div id="taskContent"></div></section><section id="inventoryView" class="view"><div class="directory-head"><div class="search"><span>⌕</span><input id="directorySearch" type="search" placeholder="Search inventory"></div><button class="primary-btn" id="addDirectoryBtn">＋ Add</button></div><div class="inventory-csv-actions"><button id="inventoryCsvImportBtn" type="button">⇧ Import</button><button id="inventoryCsvExportBtn" type="button">⇩ Export</button><button id="inventoryCsvTemplateBtn" type="button">⧉ Template</button></div><input id="inventoryCsvFile" type="file" accept=".csv,text/csv" hidden><div id="directoryJump" class="directory-jump"></div><div id="directoryContent"></div></section><section id="archiveView" class="view"><div id="archivedContent"></div></section><div hidden><div id="dueContent"></div><div id="registerContent"></div><input id="s <dialog id="quickDateDialog"><form id="quickDateForm"><div class="modal-head"><h2>Select date</h2><button class="icon-btn" type="button" data-close="quickDateDialog">✕</button></div><div class="modal-body"><div class="field"><label>DATE</label><input id="quickDate" type="date" required></div></div><div class="modal-actions"><button class="ghost-btn" type="button" data-close="quickDateDialog">Cancel</button><button class="primary-btn" type="submit">Continue</button></div></form></dialog><dialog id="taskDialog"><form id="taskForm"><div class="modal-head"><h2 id="taskFormTitle">Add task</h2><button class="icon-btn" type="button" data-close="taskDialog">✕</button></div><div class="modal-body"><input id="taskId" type="hidden"><div class="field"><label>TITLE</label><input id="taskTitle" required maxlength="180"></div><div class="field"><label>NOTES</label><textarea id="taskNotes" maxlength="3000"></textarea></div><div class="field-grid"><div class="field"><label>DUE DATE (OPTIONAL)</label><input id="taskDueDate" type="date"></div><div class="field"><label>STATUS</label><select id="taskStatus"><option>Next</option><option>Active</option><option>Done</option></select></div></div><div class="field"><label>NEXT ACTIONS</label><div id="checklistEditor"></div><button id="addChecklistBtn" class="ghost-btn" type="button">＋ Add Checklist Item</button></div></div><div class="modal-actions"><button id="deleteTaskBtn" class="danger-btn" type="button" hidden>Delete</button><button class="ghost-btn" type="button" data-close="taskDialog">Cancel</button><button class="primary-btn" type="submit">Save</button></div></form></dialog><dialog id="itemDialog"><form id="itemForm"><div class="modal-head"><h2 id="formTitle">Add item</h2><button class="icon-btn" type="button" data-close="itemDialog">✕</button></div><div class="modal-body"><input type="hidden" id="itemId"><div class="field"><label>TITLE</label><input id="title" required maxlength="120"></div><div class="field"><label>SELECT FROM INVENTORY (OPTIONAL)</label><select id="inventoryTitlePicker"><option value="">Choose inventory item…</option></select></div><div class="field-grid"><div class="field"><label>CATEGORY</label><select id="category"></select></div><div class="field"><label>DUE / EXPIRY DATE</label><input id="dueDate" type="date" required></div></div><div class="field"><label>REMIND ME BEFORE</label><select id="reminderDays"><option value="7">7 days</option><option value="14">14 days</option><option value="30" selected>30 days</option><option value="60">60 days</option><option value="90">90 days</option><option value="180">180 days</option><option value="365">1 year</option></select></div><div class="field"><label>NOTES</label><textarea id="notes" maxlength="1000"></textarea></div><div class="field archive-field"><label><input id="archived" type="checkbox"> ARCHIVE THIS ITEM</label></div></div><div class="modal-actions"><button id="deleteBtn" class="danger-btn" type="button" hidden>Delete</button><button class="ghost-btn" type="button" data-close="itemDialog">Cancel</button><button class="primary-btn" type="submit">Save</button></div></form></dialog>
<dialog id="filterDialog"><div class="modal-head"><h2>Filter register</h2><button class="icon-btn" type="button" data-close="filterDialog">✕</button></div><div class="modal-body"><div class="field"><label>CATEGORY</label><select id="categoryFilter"></select></div></div><div class="modal-actions"><button class="ghost-btn" id="clearFilterBtn">Clear</button><button class="primary-btn" id="applyFilterBtn">Apply</button></div></dialog>
