<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb">
<title>Life Admin</title>
<style>
:root{--bg:#eef1f5;--panel:#fff;--text:#20242a;--muted:#707782;--line:#e4e7ec;--accent:#2563eb;--accent-soft:#eaf1ff;--danger:#c43d4d;--danger-soft:#fff0f2;--warn:#a85f15;--warn-soft:#fff5e8;--ok:#247553;--shadow:0 12px 36px rgba(31,41,55,.08);--radius:18px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{width:min(100%,820px);min-height:100vh;margin:auto;background:var(--panel);position:relative;padding-bottom:86px}.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 14px;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.brand{min-width:0;flex:1}.brand h1{font-size:18px;line-height:1.1;margin:0}.brand p{margin:4px 0 0;color:var(--muted);font-size:12px}.icon-btn,.primary-btn,.ghost-btn,.danger-btn{border:0;border-radius:12px;min-height:40px;padding:0 13px;font-weight:700}.icon-btn,.ghost-btn{background:#f3f5f8;color:var(--text)}.primary-btn{background:var(--accent);color:#fff}.danger-btn{background:var(--danger-soft);color:var(--danger)}.content{padding:14px}.view{display:none}.view.active{display:block}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.summary-card{border:1px solid var(--line);border-radius:14px;padding:10px;background:#fff}.summary-card b{display:block;font-size:21px;line-height:1.1}.summary-card span{display:block;margin-top:4px;font-size:11px;color:var(--muted)}.summary-card.overdue{background:var(--danger-soft);border-color:#ffd5dc}.summary-card.soon{background:var(--warn-soft);border-color:#ffe1bc}.section{margin:16px 0}.section-title{display:flex;align-items:center;gap:7px;color:var(--muted);font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin:0 2px 7px}.section-title .count{background:#eef1f5;border-radius:999px;padding:2px 7px;letter-spacing:0}.list{border:1px solid var(--line);border-radius:15px;overflow:hidden;background:#fff}.item-row{display:flex;align-items:center;gap:10px;width:100%;padding:10px 11px;border:0;border-bottom:1px solid var(--line);background:#fff;text-align:left;color:inherit}.item-row:last-child{border-bottom:0}.item-row:active{background:#f7f9fc}.cat-icon{width:34px;height:34px;display:grid;place-items:center;flex:0 0 auto;border-radius:11px;font-size:17px;background:#f2f4f7}.item-main{min-width:0;flex:1}.item-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;font-weight:800;text-transform:uppercase}.item-meta{margin-top:3px;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.due-pill{flex:0 0 auto;border-radius:999px;padding:4px 7px;font-size:10.5px;font-weight:800;background:#eef2f7;color:#586170}.due-pill.overdue{background:var(--danger-soft);color:var(--danger)}.due-pill.soon{background:var(--warn-soft);color:var(--warn)}.empty{border:1px dashed #d8dde5;border-radius:15px;padding:28px 16px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--text);margin-bottom:5px}.toolbar{display:flex;gap:8px;margin-bottom:11px}.search{position:relative;flex:1}.search input{width:100%;height:42px;border:1px solid var(--line);border-radius:12px;padding:0 12px 0 36px;background:#f8f9fb;outline:0}.search input:focus{border-color:#9db9f5;background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}.search span{position:absolute;left:12px;top:10px;color:var(--muted)}.filter-btn{min-width:42px;border:1px solid var(--line);border-radius:12px;background:#fff}.month{margin:0 0 18px}.month-head{position:sticky;top:66px;z-index:5;padding:7px 9px;margin-bottom:6px;border-radius:10px;background:#eef2f8;color:#4e5968;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.06em}.timeline-row{display:grid;grid-template-columns:43px 1fr auto;align-items:center;gap:8px;padding:9px 5px;border-bottom:1px solid var(--line)}.timeline-date{text-align:center}.timeline-date b{display:block;font-size:16px}.timeline-date span{font-size:9px;color:var(--muted);text-transform:uppercase}.timeline-title{min-width:0;font-size:13.5px;font-weight:800;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fab{position:fixed;right:max(18px,calc((100vw - 820px)/2 + 18px));bottom:78px;z-index:25;width:52px;height:52px;border:0;border-radius:17px;background:var(--accent);color:#fff;font-size:27px;box-shadow:0 12px 24px rgba(37,99,235,.3)}.bottom-nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:30;width:min(100%,820px);height:68px;padding:6px 10px max(6px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,1fr);background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line)}.nav-btn{border:0;background:transparent;color:var(--muted);border-radius:12px;font-size:11px;font-weight:750}.nav-btn span{display:block;font-size:20px;line-height:22px}.nav-btn.active{color:var(--accent);background:var(--accent-soft)}dialog{width:min(calc(100% - 24px),520px);border:0;border-radius:20px;padding:0;box-shadow:var(--shadow);color:var(--text)}dialog::backdrop{background:rgba(25,31,40,.46);backdrop-filter:blur(3px)}.modal-head{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}.modal-head h2{font-size:17px;margin:0;flex:1}.modal-body{padding:15px;max-height:70vh;overflow:auto}.field{margin-bottom:13px}.field label{display:block;font-size:11px;font-weight:800;color:var(--muted);margin:0 0 5px 2px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 11px;background:#fff;outline:0}.field textarea{min-height:82px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#9db9f5;box-shadow:0 0 0 3px var(--accent-soft)}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal-actions{display:flex;gap:8px;padding:12px 15px;border-top:1px solid var(--line)}.modal-actions .primary-btn{margin-left:auto}.settings-actions{display:grid;gap:8px}.settings-actions button{width:100%;text-align:left}.small-note{font-size:11px;color:var(--muted);line-height:1.45}.toast{position:fixed;left:50%;bottom:82px;z-index:60;transform:translate(-50%,20px);opacity:0;background:#252a32;color:#fff;padding:9px 13px;border-radius:999px;font-size:12px;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}@media(min-width:700px){.app{box-shadow:0 0 0 1px var(--line),var(--shadow)}.content{padding:18px 22px}.fab{bottom:85px}}@media(max-width:420px){.field-grid{grid-template-columns:1fr}.summary-card{padding:9px 8px}.summary-card b{font-size:19px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="brand"><h1 id="pageTitle">Due</h1><p id="pageSubtitle">Your next important life-admin dates</p></div><button class="icon-btn" id="settingsBtn" aria-label="Settings">⚙</button></header>
<main class="content">
<section id="dueView" class="view active"><div id="summary" class="summary"></div><div id="dueContent"></div></section>
<section id="registerView" class="view"><div class="toolbar"><div class="search"><span>⌕</span><input id="searchInput" type="search" placeholder="Search register"></div><button class="filter-btn" id="filterBtn" aria-label="Filter category">☷</button></div><div id="registerContent"></div></section>
<section id="timelineView" class="view"><div id="timelineContent"></div></section>
</main>
<button class="fab" id="addBtn" aria-label="Add item">＋</button>
<nav class="bottom-nav"><button class="nav-btn active" data-view="due"><span>◉</span>Due</button><button class="nav-btn" data-view="register"><span>▤</span>Register</button><button class="nav-btn" data-view="timeline"><span>⌁</span>Timeline</button></nav>
</div>
<dialog id="itemDialog"><form id="itemForm"><div class="modal-head"><h2 id="formTitle">Add item</h2><button class="icon-btn" type="button" data-close="itemDialog">✕</button></div><div class="modal-body"><input type="hidden" id="itemId"><div class="field"><label for="title">TITLE</label><input id="title" required maxlength="120" autocomplete="off" placeholder="e.g. Car insurance"></div><div class="field-grid"><div class="field"><label for="category">CATEGORY</label><select id="category"></select></div><div class="field"><label for="dueDate">DUE / EXPIRY DATE</label><input id="dueDate" type="date" required></div></div><div class="field"><label for="reminderDays">REMIND ME BEFORE</label><select id="reminderDays"><option value="7">7 days</option><option value="14">14 days</option><option value="30" selected>30 days</option><option value="60">60 days</option><option value="90">90 days</option><option value="180">180 days</option><option value="365">1 year</option></select></div><div class="field"><label for="notes">NOTES</label><textarea id="notes" maxlength="1000" placeholder="Provider, policy number, renewal instructions..."></textarea></div></div><div class="modal-actions"><button id="deleteBtn" class="danger-btn" type="button" hidden>Delete</button><button class="ghost-btn" type="button" data-close="itemDialog">Cancel</button><button class="primary-btn" type="submit">Save</button></div></form></dialog>
<dialog id="filterDialog"><div class="modal-head"><h2>Filter register</h2><button class="icon-btn" type="button" data-close="filterDialog">✕</button></div><div class="modal-body"><div class="field"><label for="categoryFilter">CATEGORY</label><select id="categoryFilter"></select></div></div><div class="modal-actions"><button class="ghost-btn" id="clearFilterBtn" type="button">Clear</button><button class="primary-btn" id="applyFilterBtn" type="button">Apply</button></div></dialog>
<dialog id="settingsDialog"><div class="modal-head"><h2>Settings & data</h2><button class="icon-btn" type="button" data-close="settingsDialog">✕</button></div><div class="modal-body"><div class="settings-actions"><button class="ghost-btn" id="exportBtn">⇩ Export backup</button><button class="ghost-btn" id="importBtn">⇧ Import backup</button><input id="importFile" type="file" accept="application/json" hidden><button class="danger-btn" id="clearDataBtn">Delete all items</button></div><p class="small-note">Your data stays in this browser. Export a JSON backup regularly, especially before clearing browser data or moving devices.</p></div></dialog>
<div class="toast" id="toast"></div>
<script>
(()=>{
'use strict';
const KEY='lifeAdminMvpV1';
const categories=[['Home','🏠'],['Vehicle','🚗'],['Finance','💳'],['Insurance','🛡️'],['Identity','📄'],['Health','🏥'],['Subscription','📱'],['Asset','📦']];
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let state={items:load(),view:'due',search:'',filter:'All'};
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return Array.isArray(x)?x:[]}catch{return[]}}
function save(){localStorage.setItem(KEY,JSON.stringify(state.items));render()}
function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function parseDate(s){return new Date(s+'T00:00:00')}
function dayStart(d=new Date()){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function diffDays(s){return Math.ceil((parseDate(s)-dayStart())/86400000)}
function icon(cat){return categories.find(x=>x[0]===cat)?.[1]||'•'}
function fmtDate(s,year=true){return new Intl.DateTimeFormat('en-AU',{day:'numeric',month:'short',...(year?{year:'numeric'}:{})}).format(parseDate(s))}
function dueText(item){const d=diffDays(item.dueDate);if(d<0)return `${Math.abs(d)}d overdue`;if(d===0)return'Today';if(d===1)return'Tomorrow';return`${d} days`}
function status(item){const d=diffDays(item.dueDate);return d<0?'overdue':d<=Number(item.reminderDays||30)?'soon':'upcoming'}
function row(item){const st=status(item);return `<button class="item-row" data-id="${esc(item.id)}"><span class="cat-icon">${icon(item.category)}</span><span class="item-main"><span class="item-title">${esc(item.title)}</span><span class="item-meta">${esc(item.category)} · ${fmtDate(item.dueDate)}</span></span><span class="due-pill ${st}">${dueText(item)}</span></button>`}
function group(title,arr){if(!arr.length)return'';return`<section class="section"><h2 class="section-title">${title}<span class="count">${arr.length}</span></h2><div class="list">${arr.map(row).join('')}</div></section>`}
function sorted(){return [...state.items].sort((a,b)=>a.dueDate.localeCompare(b.dueDate)||a.title.localeCompare(b.title))}
function renderDue(){const all=sorted(), over=all.filter(x=>status(x)==='overdue'), soon=all.filter(x=>status(x)==='soon'), up=all.filter(x=>status(x)==='upcoming');$('#summary').innerHTML=`<div class="summary-card overdue"><b>${over.length}</b><span>Overdue</span></div><div class="summary-card soon"><b>${soon.length}</b><span>Due soon</span></div><div class="summary-card"><b>${up.length}</b><span>Upcoming</span></div>`;$('#dueContent').innerHTML=all.length?group('Overdue',over)+group('Due soon',soon)+group('Upcoming',up):empty('No life-admin items','Add your first renewal, expiry or maintenance date.')}
function empty(a,b){return`<div class="empty"><b>${a}</b>${b}</div>`}
function renderRegister(){const q=state.search.toLowerCase().trim();const arr=sorted().filter(x=>(state.filter==='All'||x.category===state.filter)&&(!q||[x.title,x.category,x.notes].join(' ').toLowerCase().includes(q)));$('#registerContent').innerHTML=arr.length?`<div class="list">${arr.map(row).join('')}</div>`:empty('No matching items','Try another search or category filter.')}
function renderTimeline(){const all=sorted();if(!all.length){$('#timelineContent').innerHTML=empty('Timeline is empty','Items appear here when you add a due date.');return}const groups={};all.forEach(x=>{const d=parseDate(x.dueDate),k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;(groups[k]??=[]).push(x)});$('#timelineContent').innerHTML=Object.entries(groups).map(([k,arr])=>{const d=parseDate(arr[0].dueDate);const len=arr.length;return`<section class="month"><div class="month-head">${new Intl.DateTimeFormat('en-AU',{month:'long',year:'numeric'}).format(d)} · ${len} item${len===1?'':'s'}</div>${arr.map(x=>{const dt=parseDate(x.dueDate);return`<button class="item-row timeline-row" data-id="${esc(x.id)}"><span class="timeline-date"><b>${dt.getDate()}</b><span>${new Intl.DateTimeFormat('en-AU',{weekday:'short'}).format(dt)}</span></span><span class="timeline-title">${icon(x.category)} ${esc(x.title)}</span><span class="due-pill ${status(x)}">${dueText(x)}</span></button>`}).join('')}</section>`}).join('')}
function render(){renderDue();renderRegister();renderTimeline()}
function setView(v){state.view=v;$$('.view').forEach(x=>x.classList.remove('active'));$(`#${v}View`).classList.add('active');$$('.nav-btn').forEach(x=>x.classList.toggle('active',x.dataset.view===v));const labels={due:['Due','Your next important life-admin dates'],register:['Register',`${state.items.length} item${state.items.length===1?'':'s'} in one place`],timeline:['Timeline','Your dates in continuous month order']};$('#pageTitle').textContent=labels[v][0];$('#pageSubtitle').textContent=labels[v][1]}
function openItem(id){const item=state.items.find(x=>x.id===id);$('#itemForm').reset();$('#itemId').value=item?.id||'';$('#formTitle').textContent=item?'Edit item':'Add item';$('#deleteBtn').hidden=!item;$('#title').value=item?.title||'';$('#category').value=item?.category||'Home';$('#dueDate').value=item?.dueDate||'';$('#reminderDays').value=String(item?.reminderDays||30);$('#notes').value=item?.notes||'';$('#itemDialog').showModal();setTimeout(()=>$('#title').focus(),50)}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1800)}
const options=categories.map(([n,i])=>`<option value="${n}">${i} ${n}</option>`).join('');$('#category').innerHTML=options;$('#categoryFilter').innerHTML='<option>All</option>'+options;
$$('.nav-btn').forEach(b=>b.onclick=()=>setView(b.dataset.view));$('#addBtn').onclick=()=>openItem();$('#settingsBtn').onclick=()=>$('#settingsDialog').showModal();$$('[data-close]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.close).close());
$('#itemForm').onsubmit=e=>{e.preventDefault();const id=$('#itemId').value||crypto.randomUUID();const item={id,title:$('#title').value.trim(),category:$('#category').value,dueDate:$('#dueDate').value,reminderDays:Number($('#reminderDays').value),notes:$('#notes').value.trim()};const idx=state.items.findIndex(x=>x.id===id);idx<0?state.items.push(item):state.items[idx]=item;save();$('#itemDialog').close();toast(idx<0?'Item added':'Changes saved')};
$('#deleteBtn').onclick=()=>{const id=$('#itemId').value;if(!id||!confirm('Delete this item?'))return;state.items=state.items.filter(x=>x.id!==id);save();$('#itemDialog').close();toast('Item deleted')};
$('#searchInput').oninput=e=>{state.search=e.target.value;renderRegister()};$('#filterBtn').onclick=()=>{$('#categoryFilter').value=state.filter;$('#filterDialog').showModal()};$('#applyFilterBtn').onclick=()=>{state.filter=$('#categoryFilter').value;$('#filterDialog').close();renderRegister();toast(state.filter==='All'?'Showing all categories':`Filtered by ${state.filter}`)};$('#clearFilterBtn').onclick=()=>{state.filter='All';$('#categoryFilter').value='All';$('#filterDialog').close();renderRegister()};
document.addEventListener('click',e=>{const r=e.target.closest('[data-id]');if(r)openItem(r.dataset.id)});
$('#exportBtn').onclick=()=>{const payload={app:'Life Admin',version:'1.0',exportedAt:new Date().toISOString(),items:state.items};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download=`life-admin-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href);toast('Backup exported')};
$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());const items=Array.isArray(data)?data:data.items;if(!Array.isArray(items))throw Error();if(!confirm(`Replace current data with ${items.length} imported item(s)?`))return;state.items=items.filter(x=>x&&x.id&&x.title&&x.dueDate);save();$('#settingsDialog').close();toast('Backup imported')}catch{alert('This does not appear to be a valid Life Admin backup.')}finally{e.target.value=''}};
$('#clearDataBtn').onclick=()=>{if(!state.items.length)return toast('No items to delete');if(confirm('Delete every item? Export a backup first if needed.')){state.items=[];save();$('#settingsDialog').close();toast('All items deleted')}};
render();setView('due');
})();
</script>
</body>
</html>
