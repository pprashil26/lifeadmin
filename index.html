<script>(()=>{'use strict';document.getElementById('brandIcon').src=ICON_URI;const KEY='lifeAdminMvpV1',DIR_KEY='lifeAdminDirectoryV1';const categories=[['Home','🏠'],['Vehicle','🚗'],['Finance','💳'],['Insurance','🛡️'],['Identity','📄'],['Health','🏥'],['Subscription','📱'],['Asset','📦'],['Event','📅']];const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const read=(k,d=[])=>{try{const x=JSON.parse(localStorage.getItem(k));return Array.isArray(x)?x:d}catch{return d}};let state={items:read(KEY).map(i=>({...i,archived:!!i.archived,archivedDate:i.archivedDate||null})),directory:read(DIR_KEY),view:'due',search:'',filter:'All',dirSearch:''};function save(){localStorage.setItem(KEY,JSON.stringify(state.items));localStorage.setItem(DIR_KEY,JSON.stringify(state.directory));render()}function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function parseDate(s){return new Date(s+'T00:00:00')}function dayStart(d=new Date()){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}function diffDays(s){return Math.ceil((parseDate(s)-dayStart())/86400000)}function icon(c){return categories.find(x=>x[0]===c)?.[1]||'•'}function fmtDate(s){return new Intl.DateTimeFormat('en-AU',{day:'numeric',month:'short',year:'numeric'}).format(parseDate(s))}function dueText(i){const d=diffDays(i.dueDate);if(d<0)return`${Math.abs(d)}d overdue`;if(d===0)return'Today';if(d===1)return'Tomorrow';return`${d} days`}function status(i){const d=diffDays(i.dueDate);return d<0?'overdue':d<=Number(i.reminderDays||30)?'soon':'upcoming'}function active(){return state.items.filter(i=>!i.archived)}function sorted(){return active().sort((a,b)=>a.dueDate.localeCompare(b.dueDate)||a.title.localeCompare(b.title))}function row(i){return`<button class="item-row" data-id="${esc(i.id)}"><span class="cat-icon">${icon(i.category)}</span><span class="item-main"><span class="item-title">${esc(i.title)}</span><span class="item-meta">${esc(i.category)} · ${fmtDate(i.dueDate)}</span></span><span class="due-pill ${status(i)}">${dueText(i)}</span></button>`}function empty(a,b){return`<div class="empty"><b>${a}</b>${b}</div>`}function group(t,a){return a.length?`<section class="section"><h2 class="section-title">${t}<span class="count">${a.length}</span></h2><div class="list">${a.map(row).join('')}</div></section>`:''}function renderDue(){const all=sorted(),o=all.filter(x=>status(x)==='overdue'),s=all.filter(x=>status(x)==='soon'),u=all.filter(x=>status(x)==='upcoming');$('#summary').innerHTML=`<div class="summary-card overdue"><b>${o.length}</b><span>Overdue</span></div><div class="summary-card soon"><b>${s.length}</b><span>Due soon</span></div><div class="summary-card"><b>${u.length}</b><span>Upcoming</span></div>`;$('#dueContent').innerHTML=all.length?group('Overdue',o)+group('Due soon',s)+group('Upcoming',u):empty('No active items','Add an item or restore one from Archive.')}function renderRegister(){const q=state.search.toLowerCase().trim(),a=sorted().filter(x=>(state.filter==='All'||x.category===state.filter)&&(!q||[x.title,x.category,x.notes].join(' ').toLowerCase().includes(q)));$('#registerContent').innerHTML=a.length?`<div class="list">${a.map(row).join('')}</div>`:empty('No matching items','Try another search or category.')}function renderTimeline(){const all=sorted();if(!all.length){$("#timelineContent").innerHTML=empty("Timeline is empty","Active items appear here.");return}const week=(d)=>{const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=x.getUTCDay()||7;x.setUTCDate(x.getUTCDate()+4-day);const yearStart=new Date(Date.UTC(x.getUTCFullYear(),0,1));return Math.ceil((((x-yearStart)/86400000)+1)/7)};const monday=(d)=>{const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(0,0,0,0);return x};const groups={};all.forEach(i=>{const d=parseDate(i.dueDate),m=monday(d),k=m.toISOString().slice(0,10);(groups[k]??=[]).push(i)});$('#timelineConten
